# Production override. Combine with the base:
#
#   IMAGE_TAG=v1.4.0 docker compose \
#     -f infra/docker-compose.yml -f infra/docker-compose.prod.yml up -d --wait
#
# ...or via infra/scripts/deploy.sh (which also backs up, migrates, smoke-checks).
#
# Required in the environment (root `.env`, chmod 600, git-ignored — or the
# host's secret store):
#   IMAGE_REGISTRY   e.g. ghcr.io/<you>        (images: <registry>/treenweb-{backend,frontend})
#   IMAGE_TAG        the release, e.g. v1.4.0  (exported by deploy.sh)
#   PAYLOAD_SECRET   >= 32 chars, unique to prod
#   POSTGRES_PASSWORD, DATABASE_URL
#   PUBLIC_SITE_URL, PUBLIC_CMS_URL            real https:// origins (app refuses
#                                             to boot on localhost in prod)
#   PAYLOAD_PUBLIC_SERVER_URL                  = PUBLIC_CMS_URL
#   CORS_ORIGINS, CSRF_ORIGINS                 the real origins
#   CMS_CACHE_TTL_S  15–30                     SSR read cache
#   SITE_DOMAIN, CMS_DOMAIN                    for the Traefik routers (Step 8)
#   PUBLIC_PLAUSIBLE_DOMAIN, PUBLIC_PLAUSIBLE_SRC   only if analytics goes live
#
# NOTE: PAYLOAD_DB_PUSH is deliberately never set here — prod applies the
# generated migrations (deploy.sh runs `payload migrate`). The backend refuses
# to boot if it is `true` in production.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  db:
    # No published ports — reachable only on the private `data` network.
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY, e.g. ghcr.io/you}/treenweb-backend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production
      # Prod applies generated migrations — never schema-push. Pinned here so a
      # stale .env can't leak `true` (the backend also refuses to boot if it is).
      PAYLOAD_DB_PUSH: 'false'
      DATABASE_URL: ${DATABASE_URL:?}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-${PUBLIC_CMS_URL:?}}
      CORS_ORIGINS: ${CORS_ORIGINS:?}
      CSRF_ORIGINS: ${CSRF_ORIGINS:?}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
      - edge
    labels:
      # Traefik routers (inert until infra/traefik/ lands — Step 8).
      - traefik.enable=true
      - traefik.docker.network=treenweb_edge
      - traefik.http.routers.cms.rule=Host(`${CMS_DOMAIN:-cms.localhost}`)
      - traefik.http.routers.cms.entrypoints=websecure
      - traefik.http.routers.cms.tls.certresolver=le
      - traefik.http.services.cms.loadbalancer.server.port=3000

  frontend:
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY, e.g. ghcr.io/you}/treenweb-frontend:${IMAGE_TAG:?set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production
      HOST: '0.0.0.0'
      PORT: '4321'
      PAYLOAD_INTERNAL_URL: http://backend:3000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?}
      PUBLIC_CMS_URL: ${PUBLIC_CMS_URL:?}
      CMS_CACHE_TTL_S: ${CMS_CACHE_TTL_S:-20}
      PUBLIC_PLAUSIBLE_DOMAIN: ${PUBLIC_PLAUSIBLE_DOMAIN:-}
      PUBLIC_PLAUSIBLE_SRC: ${PUBLIC_PLAUSIBLE_SRC:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=treenweb_edge
      - traefik.http.routers.site.rule=Host(`${SITE_DOMAIN:-localhost}`)
      - traefik.http.routers.site.entrypoints=websecure
      - traefik.http.routers.site.tls.certresolver=le
      - traefik.http.services.site.loadbalancer.server.port=4321
